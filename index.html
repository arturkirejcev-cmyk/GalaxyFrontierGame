<head>

<title>GALAXY FRONTIER</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#070b18;--panel:rgba(15,25,49,.82);--line:rgba(125,171,255,.17);--text:#edf4ff;--muted:#91a5c7;--cyan:#6be6ff;--blue:#6d8dff;--violet:#b18cff;--gold:#ffd78a;--green:#76efc0;--danger:#ff829c;--radius:20px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}body{overflow-x:hidden;background:radial-gradient(ellipse at 15% 5%,rgba(40,77,151,.28),transparent 38%),radial-gradient(ellipse at 90% 25%,rgba(100,48,160,.20),transparent 36%),linear-gradient(180deg,#080d1e,#070b18 65%,#090e20);padding-bottom:calc(88px + env(safe-area-inset-bottom))}
#stars,#stars:before,#stars:after{position:fixed;inset:0;pointer-events:none;content:"";z-index:0;background-image:radial-gradient(1px 1px at 20px 30px,#c6eaff 98%,transparent),radial-gradient(1px 1px at 90px 130px,#fff 98%,transparent),radial-gradient(2px 2px at 170px 70px,#8bbaff 98%,transparent),radial-gradient(1px 1px at 240px 190px,#fff 98%,transparent);background-size:290px 230px;opacity:.34;animation:drift 65s linear infinite}#stars:before{opacity:.2;transform:scale(1.4);animation-duration:100s}#stars:after{opacity:.16;transform:scale(1.8);animation-duration:130s}@keyframes drift{to{transform:translate3d(-35px,50px,0)}}@keyframes pulse{50%{opacity:.68;filter:blur(1px)}}@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
header,main,.bottom-nav,.toast{position:relative;z-index:1}.top{padding:calc(16px + env(safe-area-inset-top)) 16px 14px;max-width:760px;margin:auto}.brand-row{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:center;gap:11px}.brand-mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#1e5e9e,#6c55bc);box-shadow:0 0 28px #397dba55,inset 0 1px 0 #ffffff66;display:grid;place-items:center;border:1px solid #9cdfff55}.brand-mark svg{width:25px;height:25px}.brand-name{font-size:14px;font-weight:900;letter-spacing:1.45px}.brand-sub{font-size:9px;color:var(--muted);letter-spacing:2.2px;margin-top:3px}.icon-btn{width:42px;height:42px;border:1px solid var(--line);border-radius:14px;background:#14213a;color:#dceaff;display:grid;place-items:center}.icon-btn svg{width:19px;height:19px}.balance-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}.balance{background:linear-gradient(135deg,rgba(23,43,77,.9),rgba(15,24,46,.85));border:1px solid var(--line);border-radius:16px;padding:11px 13px;box-shadow:inset 0 1px 0 #ffffff0a}.balance small{display:block;font-size:9px;letter-spacing:1.5px;color:var(--muted);font-weight:800}.balance strong{display:block;margin-top:5px;font-size:18px;letter-spacing:.2px}.balance.gc strong{color:var(--gold)}.balance.gram strong{color:var(--cyan)}
main{max-width:760px;margin:0 auto;padding:4px 14px 20px}.hero{position:relative;overflow:hidden;padding:22px 19px;border-radius:24px;border:1px solid #8bbdff28;background:linear-gradient(120deg,rgba(23,50,88,.94),rgba(35,32,78,.78) 65%,rgba(18,31,61,.92));box-shadow:0 14px 40px #0004,inset 0 1px 0 #ffffff12;margin:7px 0 14px;animation:rise .35s ease both}.hero:after{content:"";position:absolute;width:190px;height:190px;right:-55px;top:-65px;border-radius:50%;background:radial-gradient(circle,#65cfff35,transparent 68%);animation:pulse 5s ease-in-out infinite}.eyebrow{font-size:9px;letter-spacing:2px;color:var(--cyan);font-weight:900}.hero h1{font-size:23px;line-height:1.15;margin:8px 0 8px;max-width:90%;letter-spacing:-.5px}.hero p{color:#b1c3e0;font-size:12px;line-height:1.55;margin:0;max-width:92%}.section-title{display:flex;justify-content:space-between;align-items:center;margin:20px 3px 10px}.section-title b{font-size:13px;letter-spacing:.8px}.section-title span{font-size:10px;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin:10px 0;box-shadow:0 10px 28px #0002,inset 0 1px 0 #ffffff08;backdrop-filter:blur(12px);animation:rise .28s ease both}.panel-title{font-size:13px;font-weight:850;letter-spacing:.35px;margin-bottom:11px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0}.muted{color:var(--muted);font-size:11px;line-height:1.5}.value{font-size:13px;font-weight:800}.divider{height:1px;background:var(--line);margin:8px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{min-height:108px;text-align:left;padding:15px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(145deg,rgba(23,39,70,.96),rgba(13,22,42,.95));color:var(--text);box-shadow:inset 0 1px 0 #ffffff0a;transition:transform .16s,border-color .16s}.tile:active,.btn:active,.icon-btn:active{transform:scale(.98)}.tile .tile-icon{width:32px;height:32px;border-radius:11px;background:linear-gradient(145deg,#2b75a8,#554d9f);display:grid;place-items:center;margin-bottom:10px;color:white}.tile svg{width:18px;height:18px}.tile strong{display:block;font-size:12px}.tile small{display:block;margin-top:4px;color:var(--muted);font-size:10px}
.btn{width:100%;border:1px solid #8fdfff45;border-radius:13px;padding:13px 15px;margin-top:10px;background:linear-gradient(100deg,#1875a8,#425bc0 65%,#684eae);color:white;font-weight:850;font-size:12px;letter-spacing:.6px;box-shadow:0 7px 22px #1b5eaa38;transition:transform .15s,filter .15s}.btn.secondary{background:linear-gradient(100deg,#1b2c4b,#26375a);border-color:var(--line);box-shadow:none;color:#dceaff}.btn.ghost{background:transparent;border-color:var(--line);box-shadow:none;color:#bdd0ed}.btn:disabled{opacity:.42;filter:grayscale(.5)}.tag{display:inline-flex;align-items:center;border:1px solid #70cfff42;background:#163a5355;color:var(--cyan);font-size:9px;letter-spacing:1px;padding:5px 8px;border-radius:99px;font-weight:800}.tag.gold{color:var(--gold);border-color:#ffd78a45;background:#4c3c1e44}.tag.green{color:var(--green);border-color:#76efc044;background:#17483b44}
.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0;padding-bottom:0}.item-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.item-name{font-size:12px;font-weight:850}.item-desc{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.45}.price{font-size:11px;color:var(--gold);font-weight:900;white-space:nowrap}.field{width:100%;background:#081426;border:1px solid #344b70;border-radius:11px;color:white;padding:12px;margin-top:8px;outline:none;font:inherit;font-size:12px}.field:focus{border-color:#66d9ff;box-shadow:0 0 0 3px #66d9ff18}.field-label{font-size:10px;color:var(--muted);display:block;margin:10px 0 0}.empty{text-align:center;padding:23px 12px;color:var(--muted);font-size:11px}.progress{height:7px;background:#071426;border-radius:20px;overflow:hidden;margin:11px 0 4px;border:1px solid #8dbaff18}.progress>i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,#49c7ff,#8d8aff);box-shadow:0 0 12px #55d4ff80}.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;gap:2px;padding:8px 5px calc(8px + env(safe-area-inset-bottom));background:rgba(7,13,28,.94);border-top:1px solid #8bbdff22;backdrop-filter:blur(18px);z-index:5}.bottom-nav button{flex:1;min-width:0;border:0;background:none;color:#8094b7;font-size:9px;font-weight:750;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 1px}.bottom-nav svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7}.bottom-nav button.active{color:var(--cyan)}.bottom-nav button.active svg{filter:drop-shadow(0 0 5px #53dfff99)}.toast{position:fixed;z-index:9;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,15px);opacity:0;pointer-events:none;max-width:calc(100% - 32px);background:#1b2e4c;border:1px solid #7bcfff55;border-radius:13px;padding:11px 15px;font-size:11px;box-shadow:0 10px 30px #0008;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.loading{padding:35px;text-align:center;color:var(--muted);font-size:12px}.spinner{width:25px;height:25px;border:2px solid #294668;border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}@keyframes spin{to{transform:rotate(360deg)}}
@media(min-width:600px){.top{padding-top:25px}.balance strong{font-size:21px}.hero{padding:28px}.hero h1{font-size:28px}.grid{grid-template-columns:repeat(4,1fr)}.bottom-nav{left:50%;right:auto;transform:translateX(-50%);width:min(100%,760px);border-left:1px solid #8bbdff22;border-right:1px solid #8bbdff22;border-radius:18px 18px 0 0}}
</style></head>
<body><div id="stars"></div>
<header class="top"><div class="brand-row"><div class="brand"><div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6"><path d="M12 2.8 14.3 9.7 21.2 12l-6.9 2.3L12 21.2l-2.3-6.9L2.8 12l6.9-2.3L12 2.8Z"/><circle cx="12" cy="12" r="2.2"/></svg></div><div><div class="brand-name">GALAXY FRONTIER</div><div class="brand-sub">COMMAND CENTER</div></div></div><button class="icon-btn" data-action="wallet" aria-label="Гаманець"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 9h18M16 14h.01"/><path d="M6 5V4a2 2 0 0 1 2-2h10"/></svg></button></div>
<div class="balance-row"><div class="balance gc"><small>GALAXY COIN</small><strong id="gc">— GC</strong></div><div class="balance gram"><small>GRAM WALLET</small><strong id="gram">DISABLED</strong></div></div></header>
<main id="app"><div class="loading"><div class="spinner"></div>Синхронізація з галактикою…</div></main>
<nav class="bottom-nav"><button data-page="home" class="active"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg>СТАНЦІЯ</button><button data-page="colonies"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><ellipse cx="12" cy="12" rx="11" ry="4" transform="rotate(-25 12 12)"/><path d="M12 5v14"/></svg>КОЛОНІЇ</button><button data-page="fleet"><svg viewBox="0 0 24 24"><path d="m12 2 4 10-4 10-4-10 4-10Z"/><path d="M8 12 3 16l5 1m8-5 5 4-5 1"/></svg>ФЛОТ</button><button data-page="shop"><svg viewBox="0 0 24 24"><path d="M4 8h16l-1 12H5L4 8Z"/><path d="M8 9V6a4 4 0 0 1 8 0v3"/></svg>МАГАЗИН</button><button data-page="market"><svg viewBox="0 0 24 24"><path d="M7 7h13l-3-3m3 3-3 3M17 17H4l3 3m-3-3 3-3"/></svg>РИНОК</button></nav>
<div id="toast" class="toast"></div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();tg?.setHeaderColor?.('#080d1e');tg?.setBackgroundColor?.('#070b18');
const API='https://YOUR_API_DOMAIN';let initData='',state=null,page='home',busy=false;
const headers=(post=false)=>{const h={'Content-Type':'application/json','Authorization':'tma '+initData};if(post)h['Idempotency-Key']=crypto.randomUUID();return h};
async function api(path,method='GET',body){const post=method!=='GET';const r=await fetch(API+path,{method,headers:headers(post),body:body===undefined?undefined:JSON.stringify(body)});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.detail||'Помилка сервера');return d}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('show'),2800)}
function money(n){return Number(n||0).toLocaleString('uk-UA')}
function panel(title,body,extra=''){return `<section class="panel ${extra}"><div class="panel-title">${title}</div>${body}</section>`}
function setPage(next){page=next;document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===next));render()}
async function refresh(){try{initData=tg?.initData||'';if(!initData)throw Error('Відкрий Mini App через кнопку в Telegram-боті.');state=await api('/api/me');document.getElementById('gc').textContent=money(state.player.gc)+' GC';document.getElementById('gram').textContent='DISABLED';render()}catch(e){document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">CONNECTION ERROR</div><h1>Зв’язок із командним центром втрачено</h1><p>${esc(e.message)}</p><button class="btn" data-action="refresh">ПОВТОРИТИ ПІДКЛЮЧЕННЯ</button></section>`}}
function render(){if(!state)return;const p=state.player;let html='';
if(page==='home'){html=`<section class="hero"><div class="eyebrow">COMMANDER · ${esc(p.tg_id)}</div><h1>Вітаємо, ${esc(p.first_name||'Командире')}</h1><p>Твоя експедиція починається тут. Розбудовуй колонії, формуй флот і відкривай нові сектори галактики.</p></section><div class="section-title"><b>КОМАНДНИЙ ЦЕНТР</b><span>OVERVIEW</span></div><div class="grid"><button class="tile" data-page="colonies"><span class="tile-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="7"/><ellipse cx="12" cy="12" rx="11" ry="4" transform="rotate(-25 12 12)"/></svg></span><strong>Мої колонії</strong><small>Видобуток і планети</small></button><button class="tile" data-page="fleet"><span class="tile-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m12 2 4 10-4 10-4-10 4-10Z"/></svg></span><strong>Мій флот</strong><small>Кораблі й експедиції</small></button><button class="tile" data-page="shop"><span class="tile-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 8h16l-1 12H5L4 8Z"/><path d="M8 9V6a4 4 0 0 1 8 0v3"/></svg></span><strong>Магазин</strong><small>Обладнання та кораблі</small></button><button class="tile" data-page="market"><span class="tile-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 7h13l-3-3m3 3-3 3M17 17H4l3 3m-3-3 3-3"/></svg></span><strong>Торговий ринок</strong><small>Обмін між гравцями</small></button></div><div class="section-title"><b>ПРОГРЕС КОМАНДИРА</b><span>YOUR STATUS</span></div>${panel('Особистий профіль',`<div class="row"><span class="muted">Кількість колоній</span><b class="value">${state.colonies.length}</b></div><div class="row"><span class="muted">Предметів у сховищі</span><b class="value">${state.inventory.reduce((a,x)=>a+x.quantity,0)}</b></div><div class="row"><span class="muted">Реальні платежі GRAM</span><span class="tag">ВИМКНЕНО</span></div>`)}<button class="btn secondary" data-page="referrals">ВІДКРИТИ РЕФЕРАЛЬНУ ПРОГРАМУ</button>`}
if(page==='colonies'){const ready=state.colonies.some(c=>c.cycle_remaining===0);const drills=state.inventory.filter(x=>x.item_code.endsWith('_DRILL')&&x.quantity>0);html=`<section class="hero"><div class="eyebrow">COLONY NETWORK</div><h1>Твої колонії</h1><p>Кожен цикл триває 7 годин. Після завершення забери виробництво, щоб запустити наступний цикл.</p></section>`+state.colonies.map(c=>{const progress=Math.min(100,Math.round((1-c.cycle_remaining/25200)*100));return panel(esc(c.name),`<div class="row"><span class="muted">${esc(c.planet_type)} · ${esc(c.installed_drill||'BASIC DRILL')}</span><span class="tag gold">${money(c.rate)} GC / ЦИКЛ</span></div><div class="row"><span class="muted">Готово до збору</span><b class="value">${c.cycle_remaining===0?money(c.rate)+' GC':'Ще '+Math.floor(c.cycle_remaining/3600)+' год '+Math.floor(c.cycle_remaining%3600/60)+' хв'}</b></div><div class="progress"><i style="width:${progress}%"></i></div>${drills.length?`<label class="field-label">ВСТАНОВИТИ ІНШИЙ БУР</label><select class="field" id="drill-${c.id}">${drills.map(d=>`<option value="${esc(d.item_code)}">${esc(d.item_code)} · ×${d.quantity}</option>`).join('')}</select><button class="btn secondary" data-action="install" data-id="${c.id}" ${c.cycle_remaining===0?'':'disabled'}>${c.cycle_remaining===0?'ВСТАНОВИТИ БУР · ЗІБРАТИ ЦИКЛ':'ЗАМІНА ПІСЛЯ ЗАВЕРШЕННЯ ЦИКЛУ'}</button>`:''}`)}).join('')+`<button class="btn" data-action="mine" ${ready?'':'disabled'}>${ready?'ЗАБРАТИ ВИДОБУТОК':'ВИДОБУТОК ЩЕ ТРИВАЄ'}</button>`}
if(page==='fleet'){const ships=state.inventory.filter(x=>['SCOUT','FREIGHTER','FIGHTER'].includes(x.item_code));const active=state.expeditions.find(x=>x.status==='active');html=`<section class="hero"><div class="eyebrow">FLEET COMMAND</div><h1>Космічний флот</h1><p>Збирай кораблі та вирушай у дослідницькі експедиції за ресурсами й Galaxy Coin.</p></section>`+(ships.length?ships.map(x=>panel(esc(x.item_code),`<div class="row"><span class="muted">У флоті</span><b class="value">${x.quantity}</b></div>`)).join(''):panel('Флот ще не сформовано','Придбай перший корабель у магазині.'))+(active?panel('АКТИВНА ЕКСПЕДИЦІЯ',`<div class="row"><span class="muted">Статус</span><span class="tag gold">${active.ends_at*1000>Date.now()?'У ПОЛЬОТІ':'ПОВЕРНУЛАСЯ'}</span></div><div class="row"><span class="muted">Завершення</span><b class="value">${new Date(active.ends_at*1000).toLocaleString('uk-UA')}</b></div><button class="btn" data-action="expedition-claim">ЗАБРАТИ НАГОРОДУ</button>`):panel('НОВА ЕКСПЕДИЦІЯ','Тривалість польоту — 60 хвилин. Нагорода визначається сервером.'))+(!active?'<button class="btn" data-action="expedition-start">ВІДПРАВИТИ ЕКСПЕДИЦІЮ</button>':'')}
if(page==='shop'){html=`<section class="hero"><div class="eyebrow">GALACTIC SUPPLY</div><h1>Магазин спорядження</h1><p>Покращуй видобуток, розширюй флот і готуйся до далеких експедицій.</p></section><div id="shoplist" class="loading"><div class="spinner"></div>Завантаження каталогу…</div>`;loadShop()}
if(page==='market'){html=`<section class="hero"><div class="eyebrow">PLAYER EXCHANGE</div><h1>Торговий ринок</h1><p>Виставляй предмети на продаж або купуй товари інших командирів. Комісія угоди — 3%.</p></section>${panel('Створити оголошення',`<label class="field-label">КОД ПРЕДМЕТА ЗІ СХОВИЩА</label><select class="field" id="sellcode">${state.inventory.filter(x=>x.quantity>0&&x.item_code!=='BASIC_DRILL').map(x=>`<option value="${esc(x.item_code)}">${esc(x.item_code)} · ${x.quantity} шт.</option>`).join('')}</select><label class="field-label">КІЛЬКІСТЬ</label><input class="field" id="sellqty" type="number" min="1" max="100" value="1"><label class="field-label">ЦІНА ЗА ВСЮ ПАРТІЮ · GC</label><input class="field" id="sellprice" type="number" min="1" step="1" placeholder="Наприклад, 500"><button class="btn" data-action="market-list" ${state.inventory.every(x=>x.quantity<=0||x.item_code==='BASIC_DRILL')?'disabled':''}>ВИСТАВИТИ НА РИНОК</button>`)}<div class="section-title"><b>АКТИВНІ ПРОПОЗИЦІЇ</b><span>MARKET</span></div><div id="marketlist" class="loading"><div class="spinner"></div>Оновлення ринку…</div>`;loadMarket()}
if(page==='wallet'){html=`<section class="hero"><div class="eyebrow">SECURE WALLET</div><h1>Гаманець командира</h1><p>Ігрові активи та історія операцій. Реальні криптовалютні функції поки не активовані.</p></section>${panel('GALAXY COIN',`<h2 style="color:var(--gold);margin:2px 0 8px">${money(p.gc)} GC</h2><p class="muted">Внутрішня ігрова валюта. Її можна отримувати за видобуток, експедиції та інші ігрові дії.</p>`)}${panel('GRAM WALLET',`<h2 style="color:var(--cyan);margin:2px 0 8px">DISABLED</h2><p class="muted">Поповнення, виведення, обмін GRAM/GC і торгівля за GRAM не працюють до підключення перевірки TON, резервів та escrow.</p><span class="tag">PAYMENTS DISABLED</span>`)}`}
if(page==='referrals'){html=`<section class="hero"><div class="eyebrow">COMMANDER NETWORK</div><h1>Реферальна програма</h1><p>Запрошуй нових командирів. Бонус нараховується після їхньої першої завершеної експедиції або першого повного циклу видобутку.</p></section><div id="referralbox" class="loading"><div class="spinner"></div>Завантаження статистики…</div>`;loadReferrals()}
document.getElementById('app').innerHTML=html}
async function loadShop(){try{const d=await api('/api/shop');const el=document.getElementById('shoplist');if(!el)return;el.className='';el.innerHTML=d.categories.map(g=>panel(esc(g.category),g.items.map(i=>`<div class="item"><div class="item-head"><div><div class="item-name">${esc(i.name)}</div><div class="item-desc">${esc(i.description||'')}</div></div><div class="price">${money(i.price)} GC</div></div><button class="btn secondary" data-action="buy" data-code="${esc(i.code)}">ПРИДБАТИ</button></div>`).join(''))).join('')}catch(e){const el=document.getElementById('shoplist');if(el)el.textContent=e.message}}
async function loadMarket(){try{const d=await api('/api/market');const el=document.getElementById('marketlist');if(!el)return;el.className='';el.innerHTML=d.listings.length?d.listings.map(x=>panel(esc(x.item_code),`<div class="row"><span class="muted">Кількість: ${x.quantity} · Продавець: ${esc(x.seller_name)}</span><b class="price">${money(x.price)} GC</b></div><button class="btn secondary" data-action="market-buy" data-id="${x.id}">ПРИДБАТИ</button>`)).join(''):'<div class="empty">На ринку поки немає оголошень.</div>'}catch(e){const el=document.getElementById('marketlist');if(el)el.textContent=e.message}}
async function loadReferrals(){try{const d=await api('/api/referrals');const link=d.referral_link||'';const el=document.getElementById('referralbox');if(!el)return;el.className='';el.innerHTML=panel('ТВОЯ СТАТИСТИКА',`<div class="row"><span class="muted">Запрошено гравців</span><b class="value">${d.total}</b></div><div class="row"><span class="muted">Активовано</span><b class="value">${d.active}</b></div><div class="row"><span class="muted">Твоя винагорода</span><b class="value">+${money(d.inviter_reward)} GC</b></div><div class="row"><span class="muted">Бонус новачку</span><b class="value">+${money(d.new_user_reward)} GC</b></div><div class="divider"></div>${link?`<label class="field-label">ТВОЄ ЗАПРОШЕННЯ</label><input class="field" readonly value="${esc(link)}"><button class="btn secondary" data-action="copy-ref" data-link="${esc(link)}">СКОПІЮВАТИ ПОСИЛАННЯ</button>`:'<p class="muted">Вкажи BOT_USERNAME у конфігурації сервера, щоб показувати пряме посилання.</p>'}`)}catch(e){const el=document.getElementById('referralbox');if(el)el.textContent=e.message}}
async function action(el,fn){if(busy)return;busy=true;if(el)el.disabled=true;try{await fn()}catch(e){toast(e.message)}finally{busy=false;if(el)el.disabled=false}}
document.addEventListener('click',e=>{const pageBtn=e.target.closest('[data-page]');if(pageBtn){setPage(pageBtn.dataset.page);return}const btn=e.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action;action(btn,async()=>{if(a==='refresh'){await refresh();return}if(a==='wallet'){setPage('wallet');return}if(a==='mine'){const d=await api('/api/mine/claim','POST',{});toast(`Отримано ${money(d.claimed)} GC`);await refresh();return}if(a==='buy'){await api('/api/shop/buy','POST',{code:btn.dataset.code,quantity:1});toast('Покупку успішно виконано');await refresh();return}if(a==='install'){const code=document.getElementById('drill-'+btn.dataset.id)?.value;if(!code)throw Error('Вибери бур');const d=await api('/api/colonies/install-drill','POST',{colony_id:Number(btn.dataset.id),item_code:code});toast(`Встановлено ${d.installed}. Отримано ${money(d.claimed_gc)} GC`);await refresh();return}if(a==='expedition-start'){await api('/api/expeditions/start','POST',{duration_minutes:60});toast('Експедицію відправлено');await refresh();return}if(a==='expedition-claim'){const d=await api('/api/expeditions/claim','POST',{});toast(`Нагорода: ${d.reward_gc} GC`);await refresh();return}if(a==='market-list'){const item_code=document.getElementById('sellcode')?.value;const quantity=Number(document.getElementById('sellqty')?.value);const price=Number(document.getElementById('sellprice')?.value);if(!item_code||!Number.isInteger(quantity)||quantity<1||!Number.isSafeInteger(price)||price<1)throw Error('Перевір предмет, кількість і ціну');await api('/api/market/list','POST',{item_code,quantity,currency:'GC',price});toast('Оголошення опубліковано');await refresh();return}if(a==='market-buy'){await api('/api/market/buy','POST',{listing_id:Number(btn.dataset.id)});toast('Покупку на ринку виконано');await refresh();return}if(a==='copy-ref'){await navigator.clipboard.writeText(btn.dataset.link);toast('Посилання скопійовано');return}})});
refresh();
</script></body></html>
